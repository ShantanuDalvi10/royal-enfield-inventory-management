
{% extends "base.html" %}

{% block title %}Edit Part{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="mb-4">Edit Part</h2>
                    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label for="part_id" class="form-label">
                                Part ID
                            </label>
                            <input type="text"
                                   id="part_id"
                                   name="part_id"
                                   class="form-control"
                                   maxlength="50"
                                   value="{{ part.part_id }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="part_name" class="form-label">
                                Part Name
                            </label>
                            <input type="text"
                                   id="part_name"
                                   name="part_name"
                                   class="form-control"
                                   maxlength="100"
                                   value="{{ part.part_name }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">
                                Price (₹)
                            </label>
                            <input type="number"
                                   id="price"
                                   name="price"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   value="{{ part.price }}"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="stock" class="form-label">
                                Stock
                            </label>
                            <input type="number"
                                   id="stock"
                                   name="stock"
                                   class="form-control"
                                   min="0"
                                   step="1"
                                   value="{{ part.stock }}"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-danger">
                            Save Changes
                        </button>

                        <a href="{{ url_for('dash.dashboard') }}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
