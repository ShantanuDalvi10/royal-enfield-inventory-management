
{% extends "base.html" %}

{% block title %}Add Part{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card shadow">
                <div class="card-body p-4">

                    <h2 class="mb-4">Add Spare Part</h2>

                    <form method="POST"
                          action="{{ url_for('dash.add_new_part') }}">

                        <div class="mb-3">
                            <label for="part_id" class="form-label">
                                Part ID
                            </label>
                            <input
                                type="text"
                                id="part_id"
                                name="part_id"
                                class="form-control"
                                maxlength="50"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="part_name" class="form-label">
                                Part Name
                            </label>
                            <input
                                type="text"
                                id="part_name"
                                name="part_name"
                                class="form-control"
                                maxlength="100"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">
                                Price (₹)
                            </label>
                            <input
                                type="number"
                                id="price"
                                name="price"
                                class="form-control"
                                min="0"
                                step="0.01"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label for="stock" class="form-label">
                                Available Stock
                            </label>
                            <input
                                type="number"
                                id="stock"
                                name="stock"
                                class="form-control"
                                min="0"
                                step="1"
                                required
                            >
                        </div>

                        <button type="submit"
                                class="btn btn-danger w-100">
                            Add Part
                        </button>

                        <a href="{{ url_for('auth.dashboard') }}"
                           class="btn btn-outline-secondary w-100 mt-2">
                            Back to Dashboard
                        </a>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
